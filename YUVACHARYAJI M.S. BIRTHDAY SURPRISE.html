  function send(data){ try { fetch(TRACKER_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(data),keepalive:true}).catch(function(){}); } catch(e){} }
  send({action:"pageview",visitorId:visitorId,page:location.href,referrer:document.referrer,language:navigator.language,screen:screen.width+"x"+screen.height,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone});
  document.addEventListener("click",function(e){
    const b=e.target && e.target.closest ? e.target.closest("button") : null;
    if(!b || !b.textContent || b.textContent.indexOf("शुभकामना जोड़ें")===-1) return;
    const inputs=Array.from(document.querySelectorAll("input"));
    const ta=document.querySelector("textarea");
    const nameInput=inputs.find(x=>x.placeholder && x.placeholder.indexOf("राकेश")!==-1) || inputs[inputs.length-2];
    const cityInput=inputs.find(x=>x.placeholder && x.placeholder.indexOf("पुणे")!==-1) || inputs[inputs.length-1];
    send({action:"wish",visitorId:visitorId,name:nameInput?nameInput.value:"",city:cityInput?cityInput.value:"",message:ta?ta.value:""});
  },true);
})();
